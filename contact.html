<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact — Ogunbiyi Jesutomisin (Flexi-Spec)</title><meta name="description" content="Message Ogunbiyi Jesutomisin."><link rel="stylesheet" href="/style.css"></head><body><header class="nav"><div class="nav-inner"><a class="brand" href="/index.html">OGUNBIYI JESUTOMISIN<small>(FLEXI-SPEC)</small></a><nav class="nav-links"><a class="" href="/work.html">Work</a><a class="" href="/articles.html">Articles</a><a class="" href="/feed.html">Feed</a><a class="" href="/labs.html">Labs</a><a class="" href="/about.html">About</a></nav><a class="nav-cta" href="/contact.html">Let's connect ↗</a><button class="menu">☰</button></div></header><main><section class="page-hero"><div class="container"><div class="eyebrow">CONTACT</div><h1>Tell me about the problem.</h1><p>No corporate theatre. Just the problem, idea or thing you're trying to make better.</p></div></section><section class="section"><div class="container"><form id="contact" style="max-width:760px"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Message</label><textarea name="message" rows="9" required></textarea></div><button class="button primary">Send message →</button></form></div></section></main><footer><div class="container footer-grid"><span>© <span data-year></span> Ogunbiyi Jesutomisin (Flexi-Spec)</span><div class="footer-links"><a href="/handles.html">Handles</a><a href="/contributors/oparah-nation.html">Visuals by Oparah Nation</a><a href="/admin.html">Admin</a></div></div></footer><script type="module">import {supabase} from "/supabase.js";document.querySelector("#contact").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await supabase.from("messages").insert({name:f.get("name"),email:f.get("email"),message:f.get("message")});alert(error?error.message:"Message sent.");if(!error)e.target.reset();});</script></body></html>
